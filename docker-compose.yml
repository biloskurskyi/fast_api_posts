services:
  db:
    image: postgres:16
    container_name: fast_api_posts_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5864:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast_api_posts_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: fast_api_posts_web
    environment:
      API_ORIGIN: http://app:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      app:
        condition: service_started

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast_api_posts_tests
    profiles:
      - test
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: pytest

  lint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast_api_posts_lint
    profiles:
      - lint
    volumes:
      - .:/app
    command: ruff check .

volumes:
  postgres_data:
